<section id="contact" class="container section">
    <h2 class="section-title" data-anime="up">Contato</h2>
    <div class="contact">
        <div class="card contact-info" data-anime="up">
            <div>
                <p class="mono label">LOCALIZAÇÃO</p>
                <p class="value">{{ profile.location }}</p>
            </div>
            <div>
                <p class="mono label">E-MAIL</p>
                <a class="value" href="mailto:{{ profile.email }}">{{ profile.email }}</a>
            </div>
            <div>
                <p class="mono label">REDES</p>
                <div class="contact-links">
                    {% for social in profile.social %}
                    <a href="{{ social.url }}" target="_blank" rel="noopener">{{ social.label }}</a>
                    {% endfor %}
                </div>
            </div>
        </div>

        <form class="card contact-form" action="/send" method="POST" data-anime="up">
            <div class="form-field">
                <label for="nome">Nome</label>
                <input class="field" type="text" id="nome" name="nome" placeholder="Seu nome" required>
            </div>
            <div class="form-field">
                <label for="email">E-mail</label>
                <input class="field" type="email" id="email" name="email" placeholder="voce@email.com" required>
            </div>
            <div class="form-field form-full">
                <label for="mensagem">Mensagem</label>
                <textarea class="field" id="mensagem" name="mensagem" rows="6"
                    placeholder="Conte um pouco sobre o projeto ou a vaga" required></textarea>
            </div>
            <div class="form-full">
                <button id="btn-send" type="submit" class="btn btn-primary">Enviar mensagem</button>
                <button id="btn-send-spinner" class="btn btn-primary" type="button" disabled>
                    <span class="spinner" aria-hidden="true"></span> Enviando...
                </button>
            </div>
        </form>
    </div>
</section>
