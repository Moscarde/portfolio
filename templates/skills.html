<section id="skills" class="container section">
    <h2 class="section-title" data-anime="up">Stack</h2>
    <div class="skills-grid">
        {% for group in data_skills %}
        <div class="card skill-group" data-anime="up">
            <h3>{{ group.title }}</h3>
            <ul class="chips">
                {% for item in group['items'] %}
                <li class="chip">{{ item }}</li>
                {% endfor %}
            </ul>
        </div>
        {% endfor %}
    </div>
</section>
