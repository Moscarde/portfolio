<section id="articles" class="container section">
    <h2 class="section-title" data-anime="up">Artigos</h2>
    <ul class="articles">
        {% for article in data_articles %}
        <li data-anime="up">
            <a href="{{ article.url }}" target="_blank" rel="noopener">
                <span class="mono article-date">{{ article.date or '—' }}</span>
                <span class="article-title">{{ article.title }}</span>
                <span class="mono article-where">{{ article.where }} ↗</span>
            </a>
        </li>
        {% endfor %}
    </ul>
</section>
